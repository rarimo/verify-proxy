post:
  tags:
    - Verification requests
  summary: Verification callback
  description: >-
    Update request with arbitrary data and new status
  operationId: verifyCallback
  parameters:
    - $ref: '#/components/parameters/requestId'
  requestBody:
    content:
      text/plain:
        schema:
          type: string
          format: string
          description: callback_data
          example: >-
            {"Lorem": "ipsum"}
  responses:
    '200':
      description: Success
    '400':
      description: Bad request
    '409':
      description: 'Conflict, request already processed'
    '500':
      description: Internal error
